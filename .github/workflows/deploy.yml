name: Build

on:
    push:
        branches: [main, uat, release*]
    pull_request_target:
        branches: [main, uat, release*]
    workflow_dispatch:

jobs:
    build:
        name: Run production build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - run: rustup toolchain install stable --profile minimal
            - name: Cache Cargo registry and build artifacts
              uses: actions/cache@v3
              with:
                  path: |
                      target
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: cargo-build-cache-${{ github.run_id }}
                  restore-keys: |
                      cargo-build-cache-
            - run: rustup target add wasm32-unknown-unknown
            - name: Install lld
              run: sudo apt install -y lld clang gcc llvm

            - name: Install worker-build
              run: |
                  if ! command -v worker-build &> /dev/null; then
                    cargo install worker-build
                  fi

            - name: Replace placeholders in wrangler.jsonc
              run: |
                  sed -i "s/\${FUFU_KV_ID}/${{ secrets.FUFU_KV_ID }}/g" wrangler.jsonc
                  sed -i "s/\${DB_CORE_ID}/${{ secrets.DB_CORE_ID }}/g" wrangler.jsonc
                  sed -i "s/\${DB_POSTS_ID}/${{ secrets.DB_POSTS_ID }}/g" wrangler.jsonc
                  sed -i "s/\${DB_MEDIA_ID}/${{ secrets.DB_MEDIA_ID }}/g" wrangler.jsonc
                  sed -i "s/\${DB_BANGUMI_ID}/${{ secrets.DB_BANGUMI_ID }}/g" wrangler.jsonc
                  sed -i "s/\${DB_SOCIAL_ID}/${{ secrets.DB_SOCIAL_ID }}/g" wrangler.jsonc
                  sed -i "s/\${DB_LIKES_ID}/${{ secrets.DB_LIKES_ID }}/g" wrangler.jsonc
                  sed -i "s/\${DB_LEGAL_ID}/${{ secrets.DB_LEGAL_ID }}/g" wrangler.jsonc
                  sed -i "s/\${DB_AUTH_ID}/${{ secrets.DB_AUTH_ID }}/g" wrangler.jsonc

            - name: Build
              run: worker-build --release

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Replace system Node.js with v22
              run: |
                  sudo rm -f /usr/local/bin/node /usr/local/bin/npx /usr/local/bin/npm
                  sudo ln -s "$(which node)" /usr/local/bin/node
                  sudo ln -s "$(which npx)" /usr/local/bin/npx
                  node --version
            - uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: '4.88.0'
