[package]
name = "fufu-rs"
version = "0.1.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["axum", "d1", "http"] }
worker-macros = { version = "0.8", features = ["http"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"

axum = { version = "0.8", default-features = false, features = ["json", "macros", "form", "query"] }
tower-http = { version = "0.6", features = ["cors"] }
tower-service = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

jsonwebtoken = "9.3"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
base32 = "0.5"
md5 = "0.7"

sha1 = "0.10"
hmac = "0.12"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }

thiserror = "2"
console_error_panic_hook = "0.1"
urlencoding = "2"
reqwest = { version = "0.12", features = ["json", "multipart"] }
futures = "0.3"
aws-config = { version = "1", default-features = false }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1", default-features = false }
aws-smithy-async = "1"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"

[profile.release]
lto = true
codegen-units = 1
